[project]
name = "snapcheck"
version = "0.1.0"
authors = [{ name = "BrainVISA team", email = "contact@brainvisa.info" }]
description = "Make visual checking and annotation using HTML boards."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "CeCILL-B" }
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Natural Language :: English",
]


[project.optional-dependencies]
doc = ["sphinx >=1.0", "sphinx-rtd-theme"]

[project.urls]
homepage = "http://brainvisa.github.io/snapcheck/"
repository = "https://github.com/brainvisa/snapcheck"

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js"]

[tool.pixi.project]
channels = ["https://repo.prefix.dev/conda-forge"]
platforms = ["linux-64"]

[tool.pixi.tasks]
snapcheck="./scripts/start_local.sh"
client="python python/snapclient/main.py"

[tool.pixi.dependencies]
pyqtwebengine = "<6"
fastapi = ">=0.115.12,<0.116"
nodejs = ">=24.4.1,<24.5"
requests = ">=2.32.4,<3"
py2puml = ">=0.9.1,<0.10"

# For the tests
pytest = ">=9.0.2,<10"

# For the doc
sphinx = ">=8.2,<10"
sphinx-gallery = ">=0.20.0,<0.21"
sphinx_bootstrap_theme = ">=0.8.1,<0.9"
numpydoc = ">=1.10.0,<2"
sphinxcontrib-fulltoc = ">=1.2.0,<2"
matplotlib = ">=3.10.8,<4"
sphinx-mdinclude = ">=0.6.2,<0.7"
sphinxcontrib-openapi = ">=0.8.3,<1.0"
pyjwt = ">=2.10.1,<3"
xhtml2pdf = ">=0.2.16,<0.3"
pypdf = ">=6.6.0,<7"
uvicorn = ">=0.40.0,<0.41"


[tool.pixi.pypi-dependencies]
snapcheck = { path = ".", editable = true }

[tool.setuptools.packages.find]
where = ["python"]
