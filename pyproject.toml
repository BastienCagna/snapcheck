[project]
name = "snapcheck"
version = "0.1.0"
authors = [{ name = "BrainVISA team", email = "contact@brainvisa.info" }]
description = "Control the quality of analysis performed on many neuroimaging data"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "CeCILL-B" }
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Natural Language :: English",
]


[project.optional-dependencies]
doc = ["sphinx >=1.0", "sphinx-rtd-theme"]

[project.urls]
homepage = "http://brainvisa.github.io/snapcheck/"
repository = "https://github.com/brainvisa/snapcheck"

[tool.setuptools.package-data]
"*" = ["*.html", "*.css", "*.js"]

[tool.pixi.project]
channels = [
    "https://brainvisa.info/neuro-forge",
    "https://repo.prefix.dev/conda-forge",
]
platforms = ["linux-64"]

[tool.pixi.tasks]
snapcheck="./scripts/start_local.sh"
client="python python/snapclient/main.py"

[tool.pixi.dependencies]
pyqtwebengine = "<6"
fastapi = ">=0.115.12,<0.116"
nodejs = ">=24.4.1,<24.5"
requests = ">=2.32.4,<3"

[tool.pixi.pypi-dependencies]
snapcheck = { path = ".", editable = true }

[tool.setuptools.packages.find]
where = ["python"]
